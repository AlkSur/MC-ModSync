[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmodsync"
version = "2.0.0"
description = "Minecraft NeoForge 服务端 mods 增量同步系统（A 端 OP 工具）"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "paramiko>=3.4",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcmodsync = "mcmodsync.cli:main"

[tool.setuptools]
packages = ["mcmodsync", "mcmodsync.storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
