name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: B 单文件防漂移（重新生成与仓库版本一致）
        run: python tools/build_server.py --check

      - name: 单文件 B Python 3.8 语法检查
        run: python -c "import ast;ast.parse(open('server/mcmodsync-b.py',encoding='utf-8').read(),feature_version=(3,8))"

      - name: Test
        run: python -m pytest
